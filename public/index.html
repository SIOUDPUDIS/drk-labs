<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- Mobil uyumu bozmamak için 'maximum-scale=1' ekledim -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRK LABS | Networking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="menu-btn" onclick="toggleSidebar()">☰</button>

    <!-- Giriş Ekranı -->
    <div id="auth-screen">
        <h2>DRK LABS</h2>
        <input type="email" id="email-input" placeholder="E-posta...">
        <button onclick="checkEmail()">SİSTEME BAĞLAN</button>
    </div>

    <!-- İsim Belirleme Modalı -->
    <div id="username-modal" style="display:none;">
        <h3>Kullanıcı Adını Belirle</h3>
        <input id="username-input" placeholder="Kullanıcı adın...">
        <button onclick="saveUser()">KAYDI TAMAMLA</button>
    </div>

    <!-- Ana Uygulama -->
    <div id="app" style="display:none;">
        <div id="sidebar">
            <div class="header-imza">
                <h3>DRK LABS</h3>
                <p>Site Yapımcısı: Egemen Tuğra Doruk</p>
            </div>
            
            <div id="sabit-kanallar">
                <div class="channel" onclick="joinChannel('antalya')"># Antalya Genel</div>
                <div class="channel" onclick="joinChannel('borsa')"># DRK Borsa</div>
            </div>
            
            <hr style="width: 100%; border: 0; border-top: 1px solid #333;">
            
            <input type="text" id="channel-search" placeholder="Kanal ara..." onkeyup="searchChannels()">
            <div id="search-results"></div> 
            
            <hr style="width: 100%; border: 0; border-top: 1px solid #333;">
            
            <h4>Katıldığın Kanallar</h4>
            <div id="joined-channels"></div>
            
            <button style="margin-top: 10px;" onclick="showBasvuruFormu()">+ Kanal Başvurusu</button>
            <div id="user-info"></div>
        </div>
        
        <!-- Chat Alanı -->
        <div id="chat-area">
            <div id="messages"></div>
            <div class="input-area">
                <input id="msg-input" placeholder="Mesajını yaz..." onkeydown="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">GÖNDER</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
